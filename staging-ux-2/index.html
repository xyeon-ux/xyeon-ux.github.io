<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Portfolio — 2026.05</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@1,700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #000;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    color: #17191a;
    overflow: hidden;
  }
  /* Stage scales the fixed 1920×1080 canvas to any viewport */
  #viewport {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  #stage {
    position: relative;
    width: 1920px;
    height: 1080px;
    background: #f9f9f9;
    overflow: hidden;
    transform-origin: center center;
    flex-shrink: 0;
  }

  /* ---------- Top nav ---------- */
  .avatar-wrap {
    position: absolute;
    left: 670px; top: 48px;
    width: 92px; height: 92px;
    z-index: 30;
  }
  .avatar {
    position: absolute; inset: 0;
    border-radius: 50%;
    background: #fff url(./assets/avatar.png) center / cover no-repeat;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    cursor: pointer;
  }
  .avatar-tooltip {
    position: absolute;
    top: 108px;
    left: 50%;
    transform: translateX(-50%) translateY(-6px);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 14px 14px 22px;
    background: #ffffff;
    color: #17191a;
    border-radius: 20px;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-size: 18px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity .18s ease, transform .18s ease;
    box-shadow: 0 22px 44px -14px rgba(0,0,0,0.22),
                0 6px 16px -6px rgba(0,0,0,0.10);
    z-index: 40;
  }
  .avatar-tooltip::before {
    content: '';
    position: absolute;
    top: -6px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 14px; height: 14px;
    background: #ffffff;
    border-radius: 3px;
  }
  .avatar-wrap.is-open .avatar-tooltip {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  .tip-label {
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-weight: 700;
    font-size: 16px;
    color: rgba(0,0,0,0.45);
  }
  .tip-email {
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-weight: 500;
    color: #17191a;
    letter-spacing: 0.01em;
  }
  .tip-copy {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px; height: 34px;
    border-radius: 10px;
    background: rgba(0,0,0,0.06);
    border: none;
    color: #17191a;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
    padding: 0;
  }
  .tip-copy:hover { background: rgba(0,0,0,0.10); }
  .tip-copy:active { background: rgba(0,0,0,0.14); }
  .tip-copy.copied {
    background: #d97757;
    color: #ffffff;
  }
  .tip-copy svg {
    width: 18px; height: 18px;
    display: block;
  }
  .nav {
    position: absolute;
    left: 787px; top: 52px;
    height: 84px;
    background: #ffffff;
    border-radius: 26px;
    display: inline-flex;
    align-items: center;
    padding: 0 13px;
    gap: 4px;
    width: max-content;
  }
  .nav-item {
    height: 58px;
    padding: 0 28px;
    border-radius: 16px;
    background: transparent;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-weight: 700;
    font-size: 25.4px;
    line-height: 1;
    color: #8c8c8c;
    cursor: pointer;
    user-select: none;
    transition: background .25s ease, color .25s ease;
  }
  .nav-item:hover { color: #17191a; }
  .nav-item.is-active {
    background: #eaeaea;
    color: #000;
  }

  /* ---------- Bento card base ---------- */
  .card {
    position: absolute;
    border-radius: 28px;
    overflow: hidden;
    cursor: pointer;
    transition: transform .35s cubic-bezier(.2,.7,.2,1.05),
                box-shadow .35s ease,
                opacity .4s ease;
    will-change: transform;
  }
  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 22px 48px -18px rgba(0,0,0,0.22);
  }
  .card:active { transform: translateY(-2px) scale(.997); }

  /* ---------- velog card ---------- */
  .card-velog {
    left: 271px; top: 179px;
    width: 259px; height: 269px;
    background: #d1d1d1;
  }
  .card-velog .logo {
    position: absolute;
    left: 36px; top: 104px;
    width: 187px; height: 61px;
  }
  .card-velog .logo img { width: 100%; height: 100%; display: block; }

  /* ---------- Behance card ---------- */
  .card-behance {
    left: 271px; top: 472px;
    width: 259px; height: 270px;
    background: #e9e9e9;
  }
  .card-behance .logo {
    position: absolute;
    left: 52px; top: 85px;
    width: 159px; height: 99px;
  }
  .card-behance .logo img.a {
    position: absolute; left: 0; top: 0;
    width: 80.879px; height: 96.536px;
  }
  .card-behance .logo img.b {
    position: absolute; left: 87.879px; top: 6.656px;
    width: 69.208px; height: 92.299px;
  }

  /* ---------- UX is cute card ---------- */
  .card-ux {
    left: 554px; top: 179px;
    width: 783px; height: 269px;
    background: #ffffff;
  }
  .card-ux .title {
    position: absolute;
    left: 44px; top: 25px;
    font-weight: 700;
    font-size: 72px;
    line-height: 1;
    color: #17191a;
    letter-spacing: -0.02em;
  }
  .card-ux .emoji-row {
    position: absolute;
    left: 0; top: 121px;
    width: 100%;
    height: 120px;
    overflow: hidden;
  }
  .card-ux .emoji-track {
    position: absolute;
    left: 35px; top: 0;
    height: 120px;
    white-space: nowrap;
    animation: ux-scroll 22s linear infinite;
    will-change: transform;
  }
  .card-ux .emoji-track .em {
    display: inline-block;
    width: 120px;
    height: 120px;
    margin-right: 32px;
    line-height: 120px;
    text-align: center;
    font-size: 96px;
    vertical-align: middle;
  }
  @keyframes ux-scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-760px); }
  }
  .card-ux:hover .emoji-track {
    animation-play-state: paused;
  }
  @media (prefers-reduced-motion: reduce) {
    .card-ux .emoji-track { animation: none; }
  }

  /* ---------- iPhones card ---------- */
  .card-iphones {
    left: 554px; top: 472px;
    width: 379.5px; height: 270px;
    background: #eaeaea;
  }
  .card-iphones img {
    position: absolute;
    left: 50%; top: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* ---------- JAJAK macbook card ---------- */
  .card-jajak {
    left: 957.5px; top: 472px;
    width: 379.5px; height: 511px;
    background: #eaeaea;
  }
  .card-jajak .wordmark {
    position: absolute;
    left: 63.5px; top: 49px;
    width: 253.1px;
    height: 60.617px;
  }
  .card-jajak .wordmark img {
    display: block;
    width: 100%;
    height: 100%;
  }
  .card-jajak .macbook {
    position: absolute;
    left: 50%; top: 140px;
    width: 342px; height: 355px;
    transform: translateX(-50%);
  }
  .card-jajak .macbook img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  /* ---------- Frenemies card ---------- */
  .card-frenemies {
    left: 271px; top: 766px;
    width: 662px; height: 217px;
    background: #ffffff;
  }
  .card-frenemies .text {
    position: absolute;
    left: 25px; top: 75px;
    width: 612px;
    font-weight: 700;
    font-size: 68px;
    line-height: 1;
    color: #17191a;
    letter-spacing: -0.02em;
    z-index: 2;
  }
  .card-frenemies .sparkle {
    position: absolute;
    left: 526.898px; top: 26.488px;
    width: 102.292px; height: 106.972px;
    z-index: 1;
  }
  .card-frenemies .sparkle img { width: 100%; height: 100%; display: block; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ---------- Moonshot card ---------- */
  .card-moonshot {
    left: 1361px; top: 179px;
    width: 259px; height: 496px;
    background: #eaeaea;
  }
  .card-moonshot .bg {
    position: absolute;
    inset: 0;
    background: url(./assets/rocket.png) center / cover no-repeat;
  }
  .card-moonshot .word {
    position: absolute;
    left: 24px; top: 218px;
    width: 211px;
    text-align: center;
    font-family: "Montserrat", sans-serif;
    font-style: italic;
    font-weight: 700;
    font-size: 40px;
    line-height: 1.245;
    color: #ffffff;
    text-shadow: 0 4px 4px rgba(0,0,0,0.25);
  }

  /* ---------- Coming-soon spinner card ---------- */
  .card-soon {
    left: 1361px; top: 699px;
    width: 259px; height: 284px;
    background: #ffffff;
    border: 3px dashed #d6d6d6;
  }
  .card-soon .spinner {
    position: absolute;
    left: 50%; top: 50%;
    width: 121px; height: 121px;
    transform: translate(-50%, -50%);
  }
  .card-soon .spinner span {
    position: absolute;
    left: 50%; top: 0;
    width: 9px; height: 28px;
    margin-left: -4.5px;
    border-radius: 4.5px;
    background: #a3a3a3;
    transform-origin: 50% 60.5px;
  }
  .card-soon .soon-overlay {
    position: absolute;
    inset: -3px;
    border-radius: 28px;
    background: rgba(17,19,20,0.82);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 26px;
    text-align: center;
    color: #ffffff;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-weight: 600;
    font-size: 22px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    opacity: 0;
    transition: opacity .25s ease;
    pointer-events: none;
  }
  .card-soon:hover .soon-overlay,
  .card-soon:focus-visible .soon-overlay {
    opacity: 1;
  }

  /* ---------- Toast (copy confirmation) ---------- */
  .toast {
    position: fixed;
    left: 50%;
    bottom: 48px;
    transform: translateX(-50%) translateY(16px);
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 22px 14px 20px;
    background: #17191a;
    color: #ffffff;
    border-radius: 999px;
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.005em;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
    z-index: 1000;
    box-shadow: 0 22px 44px -14px rgba(0,0,0,0.40),
                0 8px 16px -8px rgba(0,0,0,0.20);
  }
  .toast.is-visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
  .toast .toast-icon {
    width: 20px; height: 20px;
    display: block;
    color: #d97757;
  }

  /* ---------- Focus / a11y ---------- */
  .card:focus-visible {
    outline: 3px solid #17191a;
    outline-offset: 4px;
  }

  /* ---------- PROJECT-mode dimming ---------- */
  /* When the PROJECT tab is active, non-project cards fade back so the
     actual project pieces (iPhones, JAJAK, Moonshot) read as the focus. */
  #stage.is-project .about-card {
    opacity: 0.3;
  }
  #stage.is-project .about-card:hover {
    opacity: 0.55;
  }
</style>
</head>
<body>

<div id="viewport">
  <div id="stage" data-screen-label="00 Main">

    <!-- Top nav -->
    <div class="avatar-wrap">
      <div class="avatar" role="img" aria-label="Designer avatar" tabindex="0"></div>

        <span class="tip-label">Contact</span>

        <button class="tip-copy" type="button" aria-label="이메일 주소 복사">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

    <nav class="nav" aria-label="Primary">

    </nav>

    <!-- velog -->
    <a class="card card-velog about-card" href="https://velog.io/@xyux99/posts" target="_blank" rel="noopener" aria-label="velog 글 모음 열기">

    <a class="card card-behance about-card" href="https://www.behance.net/horse9118790" target="_blank" rel="noopener" aria-label="Behance 프로필 열기">
      <div class="logo">
        <img class="a" src="./assets/behance-1.svg" alt="">

    <!-- UX is cute -->
    <a class="card card-ux about-card" href="#ux" aria-label="UX is cute 케이스 스터디 열기">

      <div class="emoji-row" aria-hidden="true">

          <span class="em">🍞</span>

          <span class="em">🥙</span>
          <span class="em">🍔</span>
          <span class="em">🍞</span>
          <span class="em">🪗</span>
          <span class="em">👻</span>
          <span class="em">🥙</span>

      </div>

    <!-- iPhones -->
    <a class="card card-iphones" href="#mobile" aria-label="모바일 프로젝트 열기">

<div class="toast" id="toast" role="status" aria-live="polite">

    <polyline points="20 6 9 17 4 12"></polyline>
  </svg>
  <span class="toast-text">정시연 님 이메일을 복사했습니다.</span>
</div>

<script>
  // Letterbox-scale the 1920×1080 stage to fit any viewport
  const stage = document.getElementById('stage');
  function fit() {
    const vw = window.innerWidth, vh = window.innerHeight;
    const s = Math.min(vw / 1920, vh / 1080);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();

  // Make every card behave like a link; click logs to console as a stand-in
  // for routing into a detail page (the user mentioned each block opens a
  // detail page — wire to real routes when those exist).
  document.querySelectorAll('.card').forEach(c => {
    c.addEventListener('click', (e) => {
      const key = (c.getAttribute('href') || '').replace('#','');
      console.log('[portfolio] open detail:', key);
    });
  });

  // Top-nav segmented control. Active state moves via class swap, frame
  // width stays constant because both labels share padding/height.
  // PROJECT mode also dims the about-cards via `.is-project` on the stage.
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    const activate = () => {
      navItems.forEach(i => i.classList.toggle('is-active', i === item));
      stage.classList.toggle('is-project', item.dataset.tab === 'project');
    };
    item.addEventListener('click', activate);
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        activate();
      }
    });
  });

  // Avatar tooltip — click to toggle (was hover).
  const avatarWrap = document.querySelector('.avatar-wrap');
  const avatarEl = document.querySelector('.avatar');
  avatarEl.addEventListener('click', (e) => {
    e.stopPropagation();
    avatarWrap.classList.toggle('is-open');
  });
  avatarEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      avatarWrap.classList.toggle('is-open');
    }
  });
  document.addEventListener('click', (e) => {
    if (!avatarWrap.contains(e.target)) {
      avatarWrap.classList.remove('is-open');
    }
  });

  // Avatar tooltip — copy-to-clipboard button. On success show a toast.
  const copyBtn = document.querySelector('.tip-copy');
  const toastEl = document.getElementById('toast');
  const EMAIL = 'xyeon.ux@gmail.com';
  let toastTimer;
  function showToast() {
    toastEl.classList.add('is-visible');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('is-visible'), 2200);
  }
  copyBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    e.preventDefault();
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(EMAIL);
      } else {
        const ta = document.createElement('textarea');
        ta.value = EMAIL;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      copyBtn.classList.add('copied');
      showToast();
      setTimeout(() => copyBtn.classList.remove('copied'), 1400);
    } catch (err) {
      console.warn('[portfolio] copy failed', err);
    }
  });
</script>

</body>
